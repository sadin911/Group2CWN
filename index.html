    <!-- Instant Force Redirect from old GitHub Pages URL to poke.tcgcount.com -->
    <script>
      (function() {
        if (window.location.hostname === 'sadin911.github.io') {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
          var cleanPath = window.location.pathname.replace(/^\/PokeCountTracker\/?/, '/');
          if (!cleanPath.startsWith('/')) cleanPath = '/' + cleanPath;
          window.location.replace('https://poke.tcgcount.com' + cleanPath + window.location.search + window.location.hash);
        }
      })();
    </script>

    <!-- Script to decode SPA GitHub Pages redirect -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
